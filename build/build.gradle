plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '7.0.17'
}

// Keep generated working files separate from source and release deliverables.
layout.buildDirectory = layout.projectDirectory.dir('../intermediate/gradle-output')

def itemProjectFile = file('../source/items_project.json')
def projectMetadata = new groovy.json.JsonSlurper().parse(itemProjectFile)
def projectVersion = projectMetadata.containsKey('version') ? projectMetadata.version : '0.1.0'
if (!(projectVersion instanceof String) || !(projectVersion ==~ /[A-Za-z0-9][A-Za-z0-9._+\-]{0,63}/)) {
    throw new GradleException('Invalid project version in source/items_project.json')
}
version = projectVersion
group = 'dev.lotcarnage.culinaryexpansion'
base { archivesName = "culinary-expansion-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
minecraft {
    mavenizerOutput = layout.projectDirectory.dir('../intermediate/forge-maven')
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('../intermediate/run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client')
        register('server') { args '--nogui' }
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', projectVersion
    def itemProject = file('../source/items_project.json')
    inputs.file(itemProject)
    def projectItems = new groovy.json.JsonSlurper().parse(itemProject).items
    def disabledNames = projectItems.findAll { !it.enabled }.collect { it.name } as Set
    def recipeDirectory = file('../source/main/resources/data/culinary_expansion/recipe')
    def excludedRecipes = fileTree(recipeDirectory).matching { include '**/*.json' }.files.findAll { recipe ->
        def text = recipe.getText('UTF-8')
        disabledNames.any { text.contains('"culinary_expansion:' + it + '"') }
    }.collect { recipe ->
        'culinary_expansion:' + recipeDirectory.toPath().relativize(recipe.toPath()).toString().replace('\\', '/').replaceFirst(/\.json$/, '')
    } as Set
    exclude { details ->
        def path = details.path
        if (path.startsWith('assets/culinary_expansion/items/') ||
            path.startsWith('assets/culinary_expansion/models/item/') ||
            path.startsWith('assets/culinary_expansion/textures/item/')) {
            return disabledNames.contains(details.file.name.replaceFirst(/\.[^.]+$/, ''))
        }
        if ((path.startsWith('data/culinary_expansion/recipe/') ||
             path.startsWith('data/culinary_expansion/advancement/recipes/food/')) && path.endsWith('.json')) {
            def text = details.file.getText('UTF-8')
            return disabledNames.any { text.contains('"culinary_expansion:' + it + '"') } ||
                (path.startsWith('data/culinary_expansion/advancement/recipes/food/') &&
                 excludedRecipes.any { text.contains('"' + it + '"') })
        }
        return false
    }
    filesMatching('META-INF/mods.toml') { expand mod_version: projectVersion }
}
tasks.named('jar', Jar).configure { from('../LICENSE') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
sourceSets {
    main {
        java.setSrcDirs(['../source/main/java'])
        resources.setSrcDirs(['../source/main/resources'])
    }
}
