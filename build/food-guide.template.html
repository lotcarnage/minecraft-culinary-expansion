<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>レシピ一覧 — Culinary Expansion</title>
<style>
:root{color-scheme:light;--ink:#492b18;--leaf:#a84308;--cream:#fffaf0;--orange:#ff9e24}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font:14px/1.45 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:12px 16px}a{color:var(--leaf);text-underline-offset:4px}header{background:#947461;color:#fff3df;border-radius:12px;padding:10px 14px;margin:8px 0}h1{color:#fff3df;font-size:2.8rem;margin:0 0 6px;line-height:1.3}header p{max-width:650px;position:relative;z-index:1}.eyebrow{color:#713407;letter-spacing:.15em;font-size:.8rem}.badges{display:flex;gap:6px;flex-wrap:wrap}.badges span{background:#f3dfc5;color:#593e2c;border:0;border-radius:20px;padding:2px 10px;font-size:.85rem}.controls{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin:12px 0}label{display:grid;gap:4px;font-weight:600}input,select{font:inherit;color:var(--ink);border:1px solid #d99948;border-radius:6px;padding:6px 8px;background:white}input{width:min(440px,80vw)}:focus-visible{outline:3px solid #aa3f00;outline-offset:3px}.table-wrap{width:max-content;min-width:100%;overflow:visible;border:1px solid #e5ba73;border-radius:16px;background:white}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:max(960px,100%)}th{position:sticky;top:0;background:#ffe16b;text-align:left;z-index:1;white-space:nowrap}th,td{padding:8px 10px;border-bottom:1px solid #efd8af;vertical-align:top}tbody tr:nth-child(even){background:#fff5df}tbody tr:hover{background:#ffebbc}td:first-child{min-width:180px}img{max-width:none;flex-shrink:0;float:left;margin:0 8px 0 0;image-rendering:pixelated;background:#f1f6c1;border-radius:8px}small{display:block;font-size:.8rem;color:#735237;font-weight:400}strong{display:block}td:last-child{min-width:290px}.recipe{border-top:1px dashed #d9ad64;margin-top:8px;padding-top:4px}.recipe h4{margin:4px 0;font-size:inherit}.recipe h4 small{display:inline;color:#735237}.grid{display:grid;grid-template-columns:repeat(3,minmax(80px,1fr));gap:3px;margin:8px 0}.grid>div{background:#eff6bf;border:1px solid #bdce64;border-radius:6px;min-height:26px;padding:2px 4px;font-size:.8rem;display:grid;place-items:center;text-align:center;overflow-wrap:anywhere}.empty{color:#586a23}.muted{font-size:.85rem;color:#735237}code{overflow-wrap:anywhere;font-size:.75rem}#count{margin-left:auto}#empty{padding:14px;text-align:center}footer{margin:12px 0;color:#735237;font-size:.85rem}noscript{display:block;background:#ffe16b;padding:12px;border-radius:8px}@media(max-width:600px){main{padding:10px 8px}header{padding:10px 12px}th,td{padding:6px 8px}}
th{text-align:center}td:nth-child(n+2):nth-child(-n+5){text-align:right;font-variant-numeric:tabular-nums}main>p{margin:8px 0}.recipe:first-child{margin-top:0;border-top:0;padding-top:0}.recipe p{margin:4px 0}.recipe ul{margin:6px 0;padding-left:20px}
th,td,th *,td *{white-space:nowrap;overflow-wrap:normal;word-break:normal}.grid{grid-template-columns:repeat(3,max-content)}.grid>div{min-width:36px}
.hunger-icons{display:inline-flex;align-items:center;gap:1px}.hunger-icon{display:inline-block;width:1.2em;line-height:1.3}.hunger-icon.half{width:.6em;overflow:hidden}.hunger-icon.half>span{display:block;width:1.2em;transform:translateX(-.6em)}
.hunger-value{display:inline-flex;align-items:center;gap:6px}
th+th,td+td{border-left:1px solid rgba(115,82,55,.12)}
td:nth-child(n+2){vertical-align:middle}
main{padding-bottom:50vh}
tbody td:first-child{position:sticky;left:0;z-index:2;background:#fff}tbody tr:nth-child(even) td:first-child{background:#fff5df}tbody tr:hover td:first-child{background:#ffebbc}thead th{z-index:3}thead th:first-child{left:0;z-index:4}
th:first-child,td:first-child{box-shadow:inset -1px 0 0 rgba(115,82,55,.18)}
thead th:first-child{border-top-left-radius:15px}thead th:last-child{border-top-right-radius:15px}
</style></head><body><main>
<nav><a href="index.html">← ダウンロード・導入方法</a></nav>
<header><h1>レシピ一覧</h1><div class="badges"><span>Culinary Expansion v{{MOD_VERSION}}</span><span>Minecraft {{MINECRAFT_VERSION}}</span><span>{{COUNT}}品 / {{RECIPES}}レシピ</span></div></header>
<p>満腹度2＝🍖1個分。隠し満腹度は空腹になりにくさの目安で、回復量は食後の満腹度が上限です。材料の名前にカーソルを合わせるとIDを確認できます。</p>
<div class="controls"><label>料理・材料・効果を検索<input id="search" type="search" placeholder="例：卵、再生能力、minecraft:beef"></label><label>絞り込み<select id="effect"><option value="all">すべての料理</option><option value="effects">追加効果あり</option><option value="plain">追加効果なし</option></select></label><label>並べ替え<select id="sort"><option value="original">標準</option><option value="name">料理名順</option><option value="nutrition">満腹度が高い順</option><option value="saturation">隠し満腹度が高い順</option><option value="time">食事が速い順</option></select></label><output id="count" aria-live="polite"></output></div>
<noscript>すべての料理とレシピを表示しています。検索と並べ替えにはJavaScriptを有効にしてください。</noscript>
<div class="table-wrap" role="region" aria-label="料理比較表"><table><thead><tr><th scope="col">料理</th><th scope="col">最大スタック数</th><th scope="col">満腹度</th><th scope="col">隠し満腹度</th><th scope="col">食事時間</th><th scope="col">追加効果</th><th scope="col">レシピ</th></tr></thead><tbody>{{ROWS}}</tbody></table><p id="empty" hidden>該当する料理はありません。検索条件を変えてみてください。</p></div>

</main><script>
const body=document.querySelector('tbody'),rows=[...body.rows],search=document.querySelector('#search'),effect=document.querySelector('#effect'),sort=document.querySelector('#sort');
const texts=new Map(rows.map(r=>[r,(r.textContent+' '+[...r.querySelectorAll('[title]')].map(e=>e.title).join(' ')).toLocaleLowerCase()]));
function refresh(){const words=search.value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);let count=0;const ordered=sort.value==='original'?[...rows]:[...rows].sort((a,b)=>sort.value==='name'?a.cells[0].textContent.localeCompare(b.cells[0].textContent,'ja'):(Number(a.dataset[sort.value])-Number(b.dataset[sort.value]))*(sort.value==='time'?1:-1));for(const r of ordered){r.hidden=!words.every(w=>texts.get(r).includes(w))||(effect.value==='effects'&&r.dataset.effect!=='true')||(effect.value==='plain'&&r.dataset.effect==='true');if(!r.hidden)count++;body.append(r)}document.querySelector('#count').textContent=`${count} / ${rows.length}品`;document.querySelector('#empty').hidden=count!==0}
search.addEventListener('input',refresh);effect.addEventListener('change',refresh);sort.addEventListener('change',refresh);refresh();
</script></body></html>
